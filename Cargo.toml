[package]
name = "neural_sim"
version = "0.1.0"
edition = "2024"
description = "A biologically realistic spiking neural network simulator for massive scale"
authors = ["Elia <elia@example.com>"]

[features]
default = []
gui = ["dep:egui", "dep:eframe", "dep:wgpu", "dep:pollster"]

[dependencies]
rand = "0.9"
rand_distr = "0.4"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
thiserror = "2"

# Optional GUI dependencies
egui = { version = "0.34", optional = true }
eframe = { version = "0.34", optional = true }
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
