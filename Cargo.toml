[package]
name = "neural_sim"
version = "0.1.0"
edition = "2024"
description = "A biologically realistic spiking neural network simulator for massive scale"
authors = ["Elia"]
license = "MIT OR Apache-2.0"

[features]
default = ["gui"]
gui = ["dep:eframe"]
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
rand = "0.9"
rand_distr = "0.4"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
bytemuck = { version = "1", features = ["derive"] }
parking_lot = "0.12"
thiserror = "2"

# Optional GUI
eframe = { version = "0.34", optional = true, default-features = false, features = ["default_fonts", "glow"] }

# Optional GPU compute backend
wgpu = { version = "22", optional = true }
pollster = { version = "0.4", optional = true }
