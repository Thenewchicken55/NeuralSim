[package]
name = "neural_sim"
version = "0.1.0"
edition = "2024"
description = "A biologically realistic spiking neural network simulator for massive scale"
authors = ["Elia"]
license = "MIT OR Apache-2.0"

[features]
default = ["gui"]
gui = ["dep:eframe"]
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
rand = "0.9"
rand_distr = "0.4"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
bytemuck = { version = "1", features = ["derive"] }
parking_lot = "0.12"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# Optional GUI
# `x11` and `wayland` are required for Linux; they're on by default in eframe
# but we list them explicitly since we set default-features = false to avoid
# pulling in eframe's "accesskit" / "puffin" extras we don't use.
eframe = { version = "0.34", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

# Optional GPU compute backend
wgpu = { version = "22", optional = true }
pollster = { version = "0.4", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "simulation_bench"
harness = false
